name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Validate CloudFormation
        run: pip install cfn-lint && cfn-lint infra/main.yaml
      - name: Build production image
        run: docker build --tag d4sign-mcp:ci .
      - name: Scan production image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: d4sign-mcp:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
